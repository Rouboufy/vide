name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Run tests
        run: |
          mkdir -p .zig-cache/global .zig-cache/local
          ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-cache/global \
          ZIG_LOCAL_CACHE_DIR=$PWD/.zig-cache/local \
          zig build test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Build native release binaries
        env:
          VIDE_BUG_REPORT_ENDPOINT: ${{ vars.VIDE_BUG_REPORT_ENDPOINT }}
          NEOVIM_VERSION: v0.12.4
        run: |
          mkdir -p dist
          mkdir -p .zig-cache/global .zig-cache/local
          build_asset() {
            target=$1
            asset=$2
            nvim_asset=$3
            prefix="$RUNNER_TEMP/$asset"
            bundle="$RUNNER_TEMP/$asset-bundle/$asset"
            ZIG_GLOBAL_CACHE_DIR=$PWD/.zig-cache/global \
            ZIG_LOCAL_CACHE_DIR=$PWD/.zig-cache/local \
              zig build -Dtarget="$target" -Doptimize=ReleaseFast \
                -Dversion="${GITHUB_REF_NAME#v}" \
                -Dbug-report-endpoint="$VIDE_BUG_REPORT_ENDPOINT" --prefix "$prefix"
            archive="$RUNNER_TEMP/$nvim_asset.tar.gz"
            curl -fL --retry 3 -o "$archive" \
              "https://github.com/neovim/neovim/releases/download/$NEOVIM_VERSION/$nvim_asset.tar.gz"
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            mkdir -p "$bundle/bin" "$bundle/lib/vide"
            cp packaging/vide-launcher "$bundle/bin/vide"
            chmod 755 "$bundle/bin/vide"
            cp "$prefix/bin/vide" "$bundle/lib/vide/vide"
            mv "$RUNNER_TEMP/$nvim_asset" "$bundle/lib/vide/nvim"
            tar -C "$RUNNER_TEMP/$asset-bundle" -czf "dist/$asset.tar.gz" "$asset"
          }
          build_asset x86_64-linux-musl vide-linux-x86_64 nvim-linux-x86_64
          build_asset aarch64-linux-musl vide-linux-aarch64 nvim-linux-arm64
          build_asset x86_64-macos vide-macos-x86_64 nvim-macos-x86_64
          build_asset aarch64-macos vide-macos-aarch64 nvim-macos-arm64
      - name: Build AppImage
        env:
          VIDE_BUG_REPORT_ENDPOINT: ${{ vars.VIDE_BUG_REPORT_ENDPOINT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}" COMMIT_SHA="$GITHUB_SHA" bash build_appimage.sh
          tests/appimage_smoke.sh Vide.AppDir
          if appimage=$(find . -maxdepth 1 -type f -name 'Vide-*-x86_64.AppImage' -print -quit) && [ -n "$appimage" ]; then
            cp "$appimage" dist/Vide-linux-x86_64.AppImage
            mv "$appimage" "$appimage.sha256" dist/
          fi
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
